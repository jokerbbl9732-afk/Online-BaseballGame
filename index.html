<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9分割オンライン野球対戦ゲーム</title>
    <!-- Firebase SDK (v9 Modular) の読み込み -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCsCifItA84WPN4wMjXvOwvYhBjB",
          authDomain: "baseball-online.firebaseapp.com",
          databaseURL: "https://baseball-online-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "baseball-online",
          storageBucket: "baseball-online.appspot.com",
          messagingSenderId: "947654419932",
          appId: "1:947654419932:web:a2eb55d895cee05",
          measurementId: "G-2LCLBVP9HC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let roomId = null;
        let myRole = null;
        let selectedPitchZone = 5;
        let selectedPitchTypeVal = 'ストレート';
        let selectedBatZone = 5;

        window.showScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        window.createRoom = function() {
            const btn = document.getElementById('create-btn');
            btn.innerText = "作成中...";
            btn.disabled = true;

            try {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let id = '';
                for(let i = 0; i < 6; i++) {
                    id += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                roomId = id;
                myRole = 'p1';
                
                // 先攻後攻をランダムで決定 (trueならp1が先攻、falseならp1が後攻)
                const p1IsFirst = Math.random() < 0.5;

                const roomData = {
                    status: 'waiting',
                    p1Connected: true,
                    p2Connected: false,
                    p1IsFirst: p1IsFirst,
                    pitchZone: null,
                    pitchType: null,
                    batZone: null,
                    batterReady: false,
                    pitcherReady: false,
                    score1: 0,
                    score2: 0,
                    inning: 1,
                    topBot: '表',
                    message: '対戦相手を待っています'
                };

                set(ref(db, 'rooms/' + roomId), roomData).then(() => {
                    document.getElementById('display-room-id').innerText = roomId;
                    showScreen('wait-screen');
                    listenRoom();
                }).catch(error => {
                    alert('Firebase書き込みエラー: ' + error.message);
                    btn.innerText = "ルームを作成する";
                    btn.disabled = false;
                });
            } catch (err) {
                alert('JavaScriptエラー: ' + err.message);
                btn.innerText = "ルームを作成する";
                btn.disabled = false;
            }
        }

        window.joinRoom = function() {
            try {
                const inputId = document.getElementById('room-id-input').value.trim().toUpperCase();
                if (!inputId) {
                    alert('ルームIDを入力してください');
                    return;
                }
                roomId = inputId;
                myRole = 'p2';

                get(ref(db, 'rooms/' + roomId)).then(snapshot => {
                    const data = snapshot.val();
                    if (!data) {
                        alert('ルームが見つかりません');
                        return;
                    }
                    update(ref(db, 'rooms/' + roomId), {
                        p2Connected: true,
                        status: 'playing',
                        message: 'ゲーム開始！配球を選んでください'
                    }).then(() => {
                        showScreen('game-screen');
                        initGrids();
                        listenRoom();
                    });
                }).catch(error => {
                    alert('参加エラー: ' + error.message);
                });
            } catch (err) {
                alert('参加時JavaScriptエラー: ' + err.message);
            }
        }

        function listenRoom() {
            onValue(ref(db, 'rooms/' + roomId), snapshot => {
                const data = snapshot.val();
                if (!data) return;

                if (data.status === 'playing' && document.getElementById('wait-screen').classList.contains('active')) {
                    showScreen('game-screen');
                    initGrids();
                }

                updateUI(data);
            });
        }

        window.initGrids = function() {
            const pGrid = document.getElementById('pitcher-grid');
            const bGrid = document.getElementById('batter-grid');
            pGrid.innerHTML = '';
            bGrid.innerHTML = '';

            for (let i = 1; i <= 9; i++) {
                const pCell = document.createElement('div');
                pCell.className = `zone-cell ${i === selectedPitchZone ? 'selected' : ''}`;
                pCell.innerText = i;
                pCell.onclick = () => {
                    selectedPitchZone = i;
                    document.querySelectorAll('#pitcher-grid .zone-cell').forEach(c => c.classList.remove('selected'));
                    pCell.classList.add('selected');
                };
                pGrid.appendChild(pCell);

                const bCell = document.createElement('div');
                bCell.className = `zone-cell ${i === selectedBatZone ? 'selected' : ''}`;
                bCell.innerText = i;
                bCell.onclick = () => {
                    selectedBatZone = i;
                    document.querySelectorAll('#batter-grid .zone-cell').forEach(c => c.classList.remove('selected'));
                    bCell.classList.add('selected');
                };
                bGrid.appendChild(bCell);
            }
        }

        window.selectPitchType = function(type) {
            selectedPitchTypeVal = type;
            document.querySelectorAll('.pitch-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.innerText === type);
            });
        }

        function updateUI(data) {
            const isTop = (data.topBot === '表');
            
            // 役割の判定（p1IsFirstに基づいて先攻・後攻を決定）
            // 表のイニング：先攻の攻撃、裏のイニング：後攻の攻撃
            let amIPitcher = false;
            if (isTop) {
                // 表: 先攻がバッター、後攻がピッチャー
                amIPitcher = (myRole === 'p1') ? !data.p1IsFirst : data.p1IsFirst;
            } else {
                // 裏: 後攻がバッター、先攻がピッチャー
                amIPitcher = (myRole === 'p1') ? data.p1IsFirst : !data.p1IsFirst;
            }

            const myTeamType = (myRole === 'p1') ? (data.p1IsFirst ? '先攻' : '後攻') : (data.p1IsFirst ? '後攻' : '先攻');

            document.getElementById('role-display').innerText = `(${myTeamType}) 役割: ${amIPitcher ? 'ピッチャー' : 'バッター'}`;
            document.getElementById('inning-display').innerText = `${data.inning}${data.topBot}`;
            document.getElementById('score-display').innerText = `${data.score1} - ${data.score2}`;
            document.getElementById('game-message').innerText = data.message || '';

            const lobbyBackBtn = document.getElementById('lobby-back-btn');

            if (data.status === 'finished') {
                document.getElementById('pitcher-panel').style.display = 'none';
                document.getElementById('batter-panel').style.display = 'none';
                lobbyBackBtn.style.display = 'block';
                return;
            } else {
                lobbyBackBtn.style.display = 'none';
            }

            if (amIPitcher) {
                document.getElementById('pitcher-panel').style.display = 'block';
                document.getElementById('batter-panel').style.display = 'none';
            } else {
                document.getElementById('pitcher-panel').style.display = 'none';
                document.getElementById('batter-panel').style.display = 'block';
            }
        }

        window.confirmPitch = function() {
            update(ref(db, 'rooms/' + roomId), {
                pitchZone: selectedPitchZone,
                pitchType: selectedPitchTypeVal,
                pitcherReady: true,
                message: 'ピッチャー投球完了。バッターの予測を待っています...'
            });
        }

        window.confirmBat = function() {
            get(ref(db, 'rooms/' + roomId)).then(snapshot => {
                const data = snapshot.val();
                if (!data.pitcherReady) {
                    alert('ピッチャーがまだ投球していません！');
                    return;
                }

                const pZone = data.pitchZone;
                const bZone = selectedBatZone;
                let resultMsg = '';
                let s1 = data.score1;
                let s2 = data.score2;

                const isTop = (data.topBot === '表');

                // ホームラン判定（完全一致のみ得点）
                if (pZone === bZone) {
                    resultMsg = '💥 ズバリ的中！ホームラン！！';
                    if (isTop) {
                        // 表の攻撃：先攻が得点
                        if (data.p1IsFirst) { s1 += 1; } else { s2 += 1; }
                    } else {
                        // 裏の攻撃：後攻が得点
                        if (data.p1IsFirst) { s2 += 1; } else { s1 += 1; }
                    }
                } else if (Math.abs(pZone - bZone) === 1 || Math.abs(pZone - bZone) === 3) {
                    resultMsg = 'ヒット！惜しい！';
                } else {
                    resultMsg = '空振り三振！打ち取り！';
                }

                // 先攻・後攻のスコア整理
                const scoreFirst = data.p1IsFirst ? s1 : s2;
                const scoreSecond = data.p1IsFirst ? s2 : s1;

                // 1. サヨナラ勝ち判定（9回以降の裏の攻撃で、後攻がリードを奪った瞬間）
                if (!isTop && data.inning >= 9 && scoreSecond > scoreFirst) {
                    resultMsg += ' 🏆 試合終了！後攻チームのサヨナラ勝ち！';
                    update(ref(db, 'rooms/' + roomId), {
                        batZone: bZone,
                        batterReady: true,
                        message: resultMsg,
                        score1: s1,
                        score2: s2,
                        status: 'finished',
                        pitcherReady: false,
                        batterReady: false
                    });
                    return;
                }

                // 次のイニング・攻守交代の計算
                let nextInning = data.inning;
                let nextTopBot = isTop ? '裏' : '表';
                if (nextTopBot === '表') {
                    nextInning += 1;
                }

                // 2. 9回以降で、裏の攻撃が終了した時点で先攻がリードしている場合の試合終了判定（先攻の勝利）
                if (!isTop && data.inning >= 9 && scoreFirst > scoreSecond) {
                    resultMsg += ` 🏆 試合終了！先攻チームの勝利！ (${scoreFirst}対${scoreSecond})`;
                    update(ref(db, 'rooms/' + roomId), {
                        batZone: bZone,
                        batterReady: true,
                        message: resultMsg,
                        score1: s1,
                        score2: s2,
                        status: 'finished',
                        pitcherReady: false,
                        batterReady: false
                    });
                    return;
                }

                update(ref(db, 'rooms/' + roomId), {
                    batZone: bZone,
                    batterReady: true,
                    message: resultMsg,
                    score1: s1,
                    score2: s2,
                    inning: nextInning,
                    topBot: nextTopBot,
                    pitcherReady: false,
                    batterReady: false
                });
            });
        }
    </script>
