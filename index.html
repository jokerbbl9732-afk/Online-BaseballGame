<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9分割オンライン野球対戦ゲーム</title>
    <!-- Firebase SDKの読み込み -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 480px; background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; text-align: center; margin-bottom: 15px; color: #f1c40f; }
        .screen { display: none; }
        .screen.active { display: block; }
        .btn { width: 100%; padding: 16px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-align: center; display: block; }
        .btn:active { background: #c0392b; }
        .btn-blue { background: #3498db; }
        .btn-blue:active { background: #2980b9; }
        input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1rem; }
        .scoreboard { display: flex; justify-content: space-between; background: #2c3e50; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 0.9rem; }
        .zone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 220px; height: 220px; margin: 15px auto; background: #333; padding: 6px; border-radius: 8px; border: 2px solid #555; }
        .zone-cell { background: #222; border: 2px solid #444; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; cursor: pointer; color: #aaa; transition: 0.2s; }
        .zone-cell.selected { background: #e74c3c; color: white; border-color: #fff; }
        .status-box { background: #2a2a2a; padding: 10px; border-radius: 6px; text-align: center; margin: 10px 0; font-size: 0.9rem; min-height: 45px; display: flex; align-items: center; justify-content: center; }
        .pitch-type-container { display: flex; gap: 5px; justify-content: center; margin: 10px 0; }
        .pitch-btn { flex: 1; padding: 8px 4px; font-size: 0.75rem; background: #444; border: none; border-radius: 4px; color: white; cursor: pointer; }
        .pitch-btn.selected { background: #f39c12; color: #000; font-weight: bold; }
        .field { position: relative; width: 100%; height: 180px; background: radial-gradient(circle at center, #27ae60 30%, #1e8449 100%); border-radius: 8px; overflow: hidden; margin-bottom: 10px; border: 2px solid #2ecc71; }
        .home-plate { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 30px; height: 20px; background: #fff; clip-path: polygon(50% 0%, 100% 30%, 100% 100%, 0% 100%, 0% 30%); }
        .ball { position: absolute; width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px #fff; display: none; }
        .message-overlay { text-align: center; font-size: 1.3rem; font-weight: bold; color: #f1c40f; margin: 10px 0; min-height: 35px; }
    </style>
</head>
<body>
<div class="container">
    <h1>9分割オンライン野球対戦</h1>

    <!-- ロビー画面 -->
    <div id="lobby-screen" class="screen active">
        <p style="text-align:center; margin-bottom:15px; font-size:0.9rem; color:#aaa;">ルームを作って友だちにIDをシェアしよう！</p>
        
        <button class="btn" id="create-btn" onclick="createRoom()">ルームを作成する</button>
        
        <div style="margin: 30px 0 15px 0; border-top: 1px dashed #555; padding-top: 15px;">
            <label style="font-size:0.85rem; color:#aaa;">すでにあるルームに参加する場合</label>
            <input type="text" id="room-id-input" placeholder="ルームIDを入力">
            <button class="btn btn-blue" id="join-btn" style="margin-top: 10px;" onclick="joinRoom()">ルームに参加する</button>
        </div>
    </div>

    <!-- 待機画面 -->
    <div id="wait-screen" class="screen">
        <div class="status-box">対戦相手の参加を待っています...</div>
        <p style="text-align:center; font-size:0.85rem; color:#aaa; margin-bottom:10px;">ルームID: <span id="display-room-id" style="color:#f1c40f; font-weight:bold;"></span></p>
        <button class="btn" style="background:#555;" onclick="location.reload()">ロビーに戻る</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen">
        <div class="scoreboard">
            <span id="role-display">役割: 判定中...</span>
            <span>イニング: <span id="inning-display">1裏</span></span>
            <span>スコア: <span id="score-display">0 - 0</span></span>
        </div>

        <div class="field">
            <div class="ball" id="ball"></div>
            <div class="home-plate"></div>
        </div>

        <div class="message-overlay" id="game-message">ゲーム開始！</div>

        <!-- ピッチャー操作パネル -->
        <div id="pitcher-panel" style="display:none;">
            <div class="status-box">【ピッチャー】コースと球種を選んでください</div>
            <div class="pitch-type-container">
                <button class="pitch-btn selected" onclick="selectPitchType('ストレート')">ストレート</button>
                <button class="pitch-btn" onclick="selectPitch
