<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9分割オンライン野球対戦ゲーム</title>
    <!-- Firebase SDKの読み込み -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        .container { width: 100%; max-width: 480px; background: #1e1e1e; border-radius: 12px; padding: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; text-align: center; margin-bottom: 10px; color: #f1c40f; }
        .screen { display: none; }
        .screen.active { display: block; }
        .btn { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:active { background: #c0392b; }
        .btn-blue { background: #3498db; }
        .btn-blue:active { background: #2980b9; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1rem; }
        .scoreboard { display: flex; justify-content: space-between; background: #2c3e50; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 0.9rem; }
        .zone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 220px; height: 220px; margin: 15px auto; background: #333; padding: 6px; border-radius: 8px; border: 2px solid #555; }
        .zone-cell { background: #222; border: 2px solid #444; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; cursor: pointer; color: #aaa; transition: 0.2s; }
        .zone-cell.selected { background: #e74c3c; color: white; border-color: #fff; }
        .zone-cell:active { background: #c0392b; }
        .status-box { background: #2a2a2a; padding: 10px; border-radius: 6px; text-align: center; margin: 10px 0; font-size: 0.9rem; min-height: 45px; display: flex; align-items: center; justify-content: center; }
        .pitch-type-container { display: flex; gap: 5px; justify-content: center; margin: 10px 0; }
        .pitch-btn { flex: 1; padding: 8px 4px; font-size: 0.75rem; background: #444; border: none; border-radius: 4px; color: white; cursor: pointer; }
        .pitch-btn.selected { background: #f39c12; color: #000; font-weight: bold; }
        .field { position: relative; width: 100%; height: 180px; background: radial-gradient(circle at center, #27ae60 30%, #1e8449 100%); border-radius: 8px; overflow: hidden; margin-bottom: 10px; border: 2px solid #2ecc71; }
        .home-plate { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 30px; height: 20px; background: #fff; clip-path: polygon(50% 0%, 100% 30%, 100% 100%, 0% 100%, 0% 30%); }
        .ball { position: absolute; width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px #fff; display: none; }
        .message-overlay { text-align: center; font-size: 1.3rem; font-weight: bold; color: #f1c40f; margin: 10px 0; min-height: 35px; }
    </style>
</head>
<body>
<div class="container">
    <h1>9分割オンライン野球対戦</h1>

    <!-- ロビー画面 -->
    <div id="lobby-screen" class="screen active">
        <p style="text-align:center; margin-bottom:15px; font-size:0.9rem; color:#aaa;">ルームを作って友だちにIDをシェアしよう！</p>
        <button class="btn" onclick="createRoom()">ルームを作成する</button>
        <div style="margin: 20px 0; border-top: 1px solid #444;"></div>
        <input type="text" id="room-id-input" placeholder="ルームIDを入力">
        <button class="btn btn-blue" onclick="joinRoom()">ルームに参加する</button>
    </div>

    <!-- 待機画面 -->
    <div id="wait-screen" class="screen">
        <div class="status-box">対戦相手の参加を待っています...</div>
        <p style="text-align:center; font-size:0.85rem; color:#aaa; margin-bottom:10px;">ルームID: <span id="display-room-id" style="color:#f1c40f; font-weight:bold;"></span></p>
        <button class="btn" style="background:#555;" onclick="location.reload()">ロビーに戻る</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen">
        <div class="scoreboard">
            <span id="role-display">役割: 判定中...</span>
            <span>イニング: <span id="inning-display">1裏</span></span>
            <span>スコア: <span id="score-display">0 - 0</span></span>
        </div>

        <div class="field">
            <div class="ball" id="ball"></div>
            <div class="home-plate"></div>
        </div>

        <div class="message-overlay" id="game-message">ゲーム開始！</div>

        <!-- ピッチャー操作パネル -->
        <div id="pitcher-panel" style="display:none;">
            <div class="status-box">【ピッチャー】コースと球種を選んでください</div>
            <div class="pitch-type-container">
                <button class="pitch-btn selected" onclick="selectPitchType('ストレート')">ストレート</button>
                <button class="pitch-btn" onclick="selectPitchType('スライダー')">スライダー</button>
                <button class="pitch-btn" onclick="selectPitchType('カーブ')">カーブ</button>
                <button class="pitch-btn" onclick="selectPitchType('フォーク')">フォーク</button>
            </div>
            <div class="zone-grid" id="pitcher-grid"></div>
            <button class="btn" onclick="confirmPitch()">投球する！</button>
        </div>

        <!-- バッター操作パネル -->
        <div id="batter-panel" style="display:none;">
            <div class="status-box">【バッター】来るコースを予測して選択！</div>
            <div class="zone-grid" id="batter-grid"></div>
            <button class="btn" onclick="confirmBat()">スイング！</button>
        </div>
    </div>
</div>

<script>
    // Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyCsCifItA84WPN4wMjXvOwvYhBjB",
      authDomain: "baseball-online.firebaseapp.com",
      databaseURL: "https://baseball-online-default-rtdb.firebaseio.com",
      projectId: "baseball-online",
      storageBucket: "baseball-online.appspot.com",
      messagingSenderId: "947654419932",
      appId: "1:947654419932:web:a2eb55d895cee05",
      measurementId: "G-2LCLBVP9HC"
    };

    try {
        firebase.initializeApp(firebaseConfig);
    } catch (e) {
        alert("Firebase初期化エラー: " + e.message);
    }
    
    const db = firebase.database();

    let roomId = null;
    let myRole = null;
    let selectedPitchZone = 5;
    let selectedPitchTypeVal = 'ストレート';
    let selectedBatZone = 5;

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function createRoom() {
        try {
            roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            myRole = 'p1';
            
            const roomData = {
                status: 'waiting',
                p1Connected: true,
                p2Connected: false,
                pitchZone: null,
                pitchType: null,
                batZone: null,
                batterReady: false,
                pitcherReady: false,
                score1: 0,
                score2: 0,
                inning: 1,
                topBot: '表',
                message: '対戦相手を待っています'
            };

            db.ref('rooms/' + roomId).set(roomData).then(() => {
                document.getElementById('display-room-id').innerText = roomId;
                showScreen('wait-screen');
                listenRoom();
            }).catch(error => {
                alert('Firebase書き込みエラー: ' + error.message);
            });
        } catch (err) {
            alert('JavaScriptエラー: ' + err.message);
        }
    }

    function joinRoom() {
        try {
            const inputId = document.getElementById('room-id-input').value.trim().toUpperCase();
            if (!inputId) {
                alert('ルームIDを入力してください');
                return;
            }
            roomId = inputId;
            myRole = 'p2';

            db.ref('rooms/' + roomId).once('value', snapshot => {
                const data = snapshot.val();
                if (!data) {
                    alert('ルームが見つかりません');
                    return;
                }
                db.ref('rooms/' + roomId).update({
                    p2Connected: true,
                    status: 'playing',
                    message: 'ゲーム開始！配球を選んでください'
                }).then(() => {
                    showScreen('game-screen');
                    initGrids();
                    listenRoom();
                });
            }).catch(error => {
                alert('参加エラー: ' + error.message);
            });
        } catch (err) {
            alert('参加時JavaScriptエラー: ' + err.message);
        }
    }

    function listenRoom() {
        db.ref('rooms/' + roomId).on('value', snapshot => {
            const data = snapshot.val();
            if (!data) return;

            if (data.status === 'playing' && document.getElementById('wait-screen').classList.contains('active')) {
                showScreen('game-screen');
                initGrids();
            }

            updateUI(data);
        });
    }

    function initGrids() {
        const pGrid = document.getElementById('pitcher-grid');
        const bGrid = document.getElementById('batter-grid');
        pGrid.innerHTML = '';
        bGrid.innerHTML = '';

        for (let i = 1; i <= 9; i++) {
            const pCell = document.createElement('div');
            pCell.className = `zone-cell ${i === selectedPitchZone ? 'selected' : ''}`;
            pCell.innerText = i;
            pCell.onclick = () => {
                selectedPitchZone = i;
                document.querySelectorAll('#pitcher-grid .zone-cell').forEach(c => c.classList.remove('selected'));
                pCell.classList.add('selected');
            };
            pGrid.appendChild(pCell);

            const bCell = document.createElement('div');
            bCell.className = `zone-cell ${i === selectedBatZone ? 'selected' : ''}`;
            bCell.innerText = i;
            bCell.onclick = () => {
                selectedBatZone = i;
                document.querySelectorAll('#batter-grid .zone-cell').forEach(c => c.classList.remove('selected'));
                bCell.classList.add('selected');
            };
            bGrid.appendChild(bCell);
        }
    }

    function selectPitchType(type) {
        selectedPitchTypeVal = type;
        document.querySelectorAll('.pitch-btn').forEach(btn => {
            btn.classList.toggle('selected', btn.innerText === type);
        });
    }

    function updateUI(data) {
        const isP1Pitcher = (data.topBot === '表');
        const amIPitcher = (myRole === 'p1' && isP1Pitcher) || (myRole === 'p2' && !isP1Pitcher);

        document.getElementById('role-display').innerText = amIPitcher ? '役割: ピッチャー' : '役割: バッター';
        document.getElementById('inning-display').innerText = `${data.inning}${data.topBot}`;
        document.getElementById('score-display').innerText = `${data.score1} - ${data.score2}`;
        document.getElementById('game-message').innerText = data.message || '';

        if (amIPitcher) {
            document.getElementById('pitcher-panel').style.display = 'block';
            document.getElementById('batter-panel').style.display = 'none';
        } else {
            document.getElementById('pitcher-panel').style.display = 'none';
            document.getElementById('batter-panel').style.display = 'block';
        }
    }

    function confirmPitch() {
        db.ref('rooms/' + roomId).update({
            pitchZone: selectedPitchZone,
            pitchType: selectedPitchTypeVal,
            pitcherReady: true,
            message: 'ピッチャー投球完了。バッターの予測を待っています...'
        });
    }

    function confirmBat() {
        db.ref('rooms/' + roomId).once('value', snapshot => {
            const data = snapshot.val();
            if (!data.pitcherReady) {
                alert('ピッチャーがまだ投球していません！');
                return;
            }

            const pZone = data.pitchZone;
            const bZone = selectedBatZone;
            let resultMsg = '';
            let s1 = data.score1;
            let s2 = data.score2;

            if (pZone === bZone) {
                resultMsg = '💥 ズバリ的中！ホームラン！！';
                if (data.topBot === '表') s2 += 1; else s1 += 1;
            } else if (Math.abs(pZone - bZone) === 1 || Math.abs(pZone - bZone) === 3) {
                resultMsg = 'ヒット！ナイスバッティング！';
            } else {
                resultMsg = '空振り三振！打ち取り！';
            }

            let nextInning = data.inning;
            let nextTopBot = (data.topBot === '表') ? '裏' : '表';
            if (nextTopBot === '表') {
                nextInning += 1;
            }

            db.ref('rooms/' + roomId).update({
                batZone: bZone,
                batterReady: true,
                message: resultMsg,
                score1: s1,
                score2: s2,
                inning: nextInning,
                topBot: nextTopBot,
                pitcherReady: false,
                batterReady: false
            });
        });
    }
</script>
</body>
</html>
